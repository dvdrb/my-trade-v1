mode: paper

market:
  symbols: [BTC]
  timeframe: 15m
  entry_timeframe: 15m
  local_timeframe: 1h
  regime_timeframe: 4h
  warmup_candles: 800

strategy:
  version: triangle-trend-zones-nested-mtf-v1-zone-penalty
  scoring:
    use_scoring_model: true
    use_nested_mtf: true
    nested_regime_tolerance_percent: 0.01
    mtf_zone_as_hard_filter: false
    min_trade_score: 0
  pivots: {left: 4, right: 4}
  trend: {ema_fast: 50, ema_slow: 200, require_alignment: false}
  triangle: {min_candles: 16, max_candles: 160, breakout_buffer_percent: 0.0015, flat_tolerance_percent: 0.003, max_candidates: 20, line_tolerance_percent: 0.002, max_wick_violation_percent: 0.004, max_close_violation_percent: 0.002, max_allowed_close_violations: 2, max_allowed_wick_violations: 4}
  breakout: {min_body_percent: 0.30}
  zones: {tolerance_percent: 0.003, min_touches: 2, avoid_opposite_zone_within_r: 1.5}

risk:
  starting_balance: 1000
  risk_per_trade_percent: 0.005
  absolute_min_reward_risk: 1.2
  target_reward_risk: 2.0
  score_risk_tiers: [{min_score: 0, risk_percent: 0.001}]

paper: {enabled: true}
